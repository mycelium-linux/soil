<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic-tac-toe — Soil</title>
<style>
body { margin: 0; }
:root {
  color-scheme: dark;
  --ink: #e9ecf2;
  --muted: #8b93a7;
  --line: rgba(255,255,255,.08);
  --panel: #141821;
  --panel-2: #191f2b;
  --accent: #c8f169;
  --accent-ink: #18200a;
  --danger: #ff9a9a;
}
* { box-sizing: border-box; }
.app {
  min-height: 100vh;
  padding: 28px clamp(20px, 5vw, 64px) 64px;
  color: var(--ink);
  background:
    radial-gradient(900px 480px at 15% -10%, rgba(200,241,105,.10), transparent 60%),
    radial-gradient(700px 420px at 95% 5%, rgba(110,140,255,.10), transparent 55%),
    #0b0d12;
  font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { font-weight: 800; letter-spacing: .18em; font-size: 13px; }
.brand-sub { margin-left: 10px; color: var(--muted); font-weight: 500; letter-spacing: .04em; text-transform: lowercase; }
.pill {
  border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 12px; color: var(--muted); font-size: 12px;
  background: rgba(255,255,255,.03);
}
.stage { margin-top: clamp(32px, 6vh, 72px); max-width: 1080px; }
.card {
  border: 1px solid var(--line); border-radius: 20px;
  padding: clamp(22px, 4vw, 38px);
  background: linear-gradient(180deg, rgba(255,255,255,.035), transparent 60%), var(--panel);
  box-shadow: 0 24px 70px rgba(0,0,0,.38);
}
.card.soft { background: var(--panel-2); }
.eyebrow { margin: 0 0 8px; color: var(--muted); font-size: 11px; letter-spacing: .22em; }
.hint { margin: 14px 0 22px; color: var(--muted); max-width: 52ch; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spread { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.btn {
  appearance: none; border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 16px; min-width: 44px; cursor: pointer;
  color: var(--ink); background: rgba(255,255,255,.045);
  font: 600 14px/1.2 ui-sans-serif, system-ui, sans-serif;
  transition: transform .08s ease, background .15s ease, border-color .15s ease;
}
.btn:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.16); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible, .input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: #d7ff7d; }
.btn.ghost { color: var(--muted); }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.input {
  flex: 1; min-width: 0; padding: 11px 14px;
  border: 1px solid var(--line); border-radius: 12px;
  background: #0d1016; color: var(--ink);
  font: 15px/1.3 ui-sans-serif, system-ui, sans-serif;
}
.input::placeholder { color: #5d6578; }
.stack { display: grid; gap: 12px; }
.muted { color: var(--muted); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.code {
  margin: 0 0 16px; padding: 14px 16px; overflow-x: auto;
  border: 1px solid var(--line); border-radius: 12px;
  background: #0d1016; color: #d7e0f5;
  font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
  white-space: pre-wrap;
}
.tok-comment { color: #6c7488; font-style: italic; }
.tok-string { color: #a9d98d; }
.tok-keyword { color: #8db4ff; }
.tok-literal { color: #f5c451; }
.tok-number { color: #f0a6ca; }
.tok-special { color: #c8f169; font-weight: 700; }
.tok-paren { color: #8a93a8; }
.tok-fn { color: #eef1f7; }
.tok-symbol { color: #d7e0f5; }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
.ttt-card { max-width: 460px; }
.status { margin: 14px 0 18px; font-size: 18px; font-weight: 600; }
.board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
.cell {
  aspect-ratio: 1; border: 1px solid var(--line); border-radius: 14px;
  background: rgba(255,255,255,.035); color: var(--ink); cursor: pointer;
  font: 700 clamp(28px, 8vw, 48px)/1 ui-sans-serif, system-ui, sans-serif;
  transition: background .15s ease, border-color .15s ease;
}
.cell:hover:not(:disabled) { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.18); }
.cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cell:disabled { cursor: default; }
.cell.X { color: var(--accent); }
.cell.O { color: #8db4ff; }

</style>
</head>
<body>
<div class="app"><header class="topbar"><div class="brand">SOIL<span class="brand-sub">tic-tac-toe</span></div><div class="pill">in progress</div></header><main class="stage"><section class="card ttt-card"><p class="eyebrow">TIC-TAC-TOE</p><p class="status">X to move</p><div class="board"><button class="cell" data-key="0" data-op="play" data-index="0"></button><button class="cell" data-key="1" data-op="play" data-index="1"></button><button class="cell" data-key="2" data-op="play" data-index="2"></button><button class="cell" data-key="3" data-op="play" data-index="3"></button><button class="cell" data-key="4" data-op="play" data-index="4"></button><button class="cell" data-key="5" data-op="play" data-index="5"></button><button class="cell" data-key="6" data-op="play" data-index="6"></button><button class="cell" data-key="7" data-op="play" data-index="7"></button><button class="cell" data-key="8" data-op="play" data-index="8"></button></div><div class="row"><button class="btn ghost" data-op="reset">New game</button></div></section></main></div>
</body>
</html>
