<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soil UI examples</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: #0b0d12;
      color: #e9ecf2;
      font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .shell {
      min-height: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 420px);
    }
    #root { min-width: 0; }
    .editor {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 16px;
      border-left: 1px solid rgba(255,255,255,.08);
      background: #0f1219;
    }
    .editor h2 {
      margin: 0;
      font-size: 11px;
      letter-spacing: .18em;
      color: #8b93a7;
      font-weight: 700;
    }
    .editor-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .editor select {
      max-width: 55%;
      padding: 6px 8px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 8px;
      background: #141821;
      color: #e9ecf2;
      font: 11.5px/1.2 ui-sans-serif, system-ui, sans-serif;
    }
    .editor select:focus-visible { outline: 2px solid #c8f169; outline-offset: 2px; }
    .editor textarea {
      flex: 1;
      min-height: 0;
      resize: none;
      padding: 14px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 12px;
      background: #0b0e14;
      color: #d7e0f5;
      font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      tab-size: 2;
      outline: none;
    }
    .editor textarea:focus { border-color: rgba(200,241,105,.55); }
    .editor-row { display: flex; gap: 8px; align-items: center; }
    .editor button {
      appearance: none;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 10px;
      padding: 9px 14px;
      background: #c8f169;
      color: #18200a;
      font: 700 12px/1 ui-sans-serif, system-ui, sans-serif;
      cursor: pointer;
    }
    .editor button:hover { background: #d7ff7d; }
    .editor button:focus-visible { outline: 2px solid #c8f169; outline-offset: 2px; }
    #status {
      margin: 0;
      color: #8b93a7;
      font: 11.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
      max-height: 90px;
      overflow: auto;
    }
    #status.error { color: #ff9a9a; }
    body.bare .shell { grid-template-columns: 1fr; }
    body.bare .editor { display: none; }
    body.bare #root { min-height: 100vh; }
    @media (max-width: 860px) {
      .shell { grid-template-columns: 1fr; }
      .editor { position: static; height: 55vh; border-left: 0; border-top: 1px solid rgba(255,255,255,.08); }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div id="root"></div>
    <aside class="editor">
      <div class="editor-head">
        <h2 id="filename">counter.soil</h2>
        <select id="examples" aria-label="Example"></select>
      </div>
      <textarea id="source" spellcheck="false" autocomplete="off"></textarea>
      <div class="editor-row">
        <button id="apply" type="button">Apply</button>
        <span>⌘/Ctrl + Enter</span>
      </div>
      <p id="status">loading…</p>
    </aside>
  </div>
  <script src="/ui.js"></script>
</body>
</html>
